name: Build, unittest

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-cmake-windows:
    strategy:
      matrix:
        os: [windows-latest]
        platform: [x64]
        configuration: [Release]
    name: ${{ matrix.os }}-CMake
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: Set up Python
      uses: actions/setup-python@v5 # https://github.com/marketplace/actions/setup-python
      with:
        python-version: '3.7'
    - name: configure
      run: |
        mkdir out
        cd out
        cmake .. -DCMAKE_INSTALL_PREFIX=install\${{ matrix.platform }}-${{ matrix.configuration }} -DPYTHON_VERSION="3.7"
    - name: make
      run: |
        cd out
        # uncomment end of following line for *VERBOSE* output
        cmake --build . --config ${{ matrix.configuration }} -j -t install # -- /verbosity:detailed

    - name: test
      run: |
        cd out
        ctest -C ${{ matrix.configuration }} --output-on-failure

  build-linux-cmake-gcc:
    strategy:
      matrix:
        os: [ubuntu-latest]
        CXX: [14, 23]
    name: gcc-${{ matrix.os }}-CXX${{ matrix.CXX }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        mkdir target-Release
        cd target-Release
        cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX }} -DCMAKE_INSTALL_PREFIX=install ..
    - name: make
      run: |
        cd target-Release
        cmake --build . -t install -j
    - name: test
      run: |
        cd target-Release/modules
        ctest --output-on-failure

  build-linux-sanitizer:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: gcc-${{ matrix.os }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        mkdir target-Debug
        cd target-Debug
        cmake -DCMAKE_CXX_STANDARD=${{ matrix.CXX }} -DCMAKE_INSTALL_PREFIX=install -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON ..
    - name: make
      run: |
        cd target-Debug
        cmake --build . -t install -j
    - name: test
      run: |
        cd target-Debug/modules
        ctest --output-on-failure

  build-linux-cmake-clang:
    strategy:
        matrix:
            os: [ubuntu-latest]
    name: clang-${{ matrix.os }}-CXX${{ matrix.CXX }}-CMake
    runs-on: ${{ matrix.os }}
    container:
      image: silkeh/clang:latest
    steps:
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        mkdir target-Release
        cd target-Release
        cmake .. -DCMAKE_INSTALL_PREFIX=install
    - name: make
      run: |
        cd target-Release
        cmake --build . -t install -j
    - name: test
      run: |
        mkdir .git
        cd target-Release/modules
        ctest --output-on-failure

